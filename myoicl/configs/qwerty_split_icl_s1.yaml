# STEP 2a of the split-cohort design -- SYNTHETIC WARMUP (BrainCoDec stage 1).
#
# BrainCoDec does not use synthetic data *instead of* real cross-subject data;
# it uses it as stage 1 of a three-stage curriculum (synthetic pretrain ->
# context-length extension -> real cross-subject finetune). Our null result
# came from stopping at stage 1.
#
# What this stage is FOR: teaching the context module the *mechanism* -- read
# an unordered set of unlabelled segments, infer a user code, use it to shift
# the frozen features -- in a regime where episodes are unlimited and the
# ground-truth shift is known. It is architecture warmup, not the signal.
#
# It runs against the SPLIT backbone (bb50), never the released checkpoint, so
# stage 2b can finetune from it without a backbone mismatch.
phase: icl
out_dir: /data2/chenyuxiang/runs/myoicl_split_icl_s1
seed: 1501
amp: bf16

repo_root: /data2/chenyuxiang/code/emg2qwerty
user_config: generic

init_from: /data2/chenyuxiang/runs/myoicl_bb50/best.pt
freeze_backbone: true

user_split:
  backbone_frac: 0.5
  seed: 0

model:
  version: 1
  official_mlp_features: [384]
  freq_bins: 33
  num_bands: 2
  channels_per_band: 16
  d_model: 768
  tds_block_channels: [24, 24, 24, 24]
  tds_kernel_width: 32
  conditioning: deep
  d_ctx: 128
  d_bneck: 128
  film_rank: 32
  ctx_layers: 2
  ctx_heads: 4
  cross_heads: 8
  ref_context_size: 32
  dropout: 0.1

data:
  window_length: 8000
  padding: [1800, 200]
  val_batch_size: 16
  num_workers: 6

episodes:
  queries: 32
  ctx_segments: 30
  ctx_segments_range: [4, 90]   # context-length extension folded into stage 1
  ctx_segment_len: 2000
  mode_probs: [0.0, 0.5, 0.5]
  k_shot_max: 8
  cross_session_ctx: true
  meta_val_users: 8
  p_synth: 1.0                  # warmup only: every episode is a synthetic user
  synth_strength: [0.15, 0.75]  # wide, for task diversity (ICL survey 5.1.1)
  specaug: true

train:
  lr: 3.0e-4
  weight_decay: 0.01
  betas: [0.9, 0.98]
  max_steps: 10000
  warmup_steps: 1000
  grad_clip: 1.0
  log_every: 50
  val_every: 2000
  val_batches: 60
  save_every: 2000
